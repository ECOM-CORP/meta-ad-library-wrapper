[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-ad-library-unofficial-wrapper"
version = "0.1.0"
description = "Unofficial Python wrapper for the Meta Ad Library internal GraphQL endpoint, with a FastAPI layer."
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",
    "playwright>=1.44",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["meta_ad_library*"]
