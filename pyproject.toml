[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name == the console script, so `uvx meta-ad-library-mcp` (or
# `uvx --from git+https://github.com/ECOM-CORP/meta-ad-library-wrapper meta-ad-library-mcp`)
# resolves cleanly. The import package stays `meta_ad_library`.
name = "meta-ad-library-mcp"
version = "0.8.0"
description = "Unofficial Meta Ad Library wrapper exposed as an MCP server (self-hosted, runs on your own IP)."
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",
    "playwright>=1.44",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "mcp>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
# Entry point uvx/pipx run. Defaults to stdio transport (Claude Desktop / local).
meta-ad-library-mcp = "meta_ad_library.mcp_server:main"

[tool.setuptools.packages.find]
include = ["meta_ad_library*"]
