# Default deploy: MCP server only, bound to LOCALHOST (127.0.0.1:8765).
# Use this when the VPS already runs a web server (Apache/nginx) — point an existing
# vhost at http://127.0.0.1:8765 (see DEPLOY.md). Caddy is NOT used here, so it won't
# fight Apache over ports 80/443.
#
#   docker compose up -d --build      (needs .env with MCP_TOKEN — see .env.example)

services:
  mcp:
    build: .
    restart: unless-stopped
    environment:
      MCP_TOKEN: "${MCP_TOKEN:?set MCP_TOKEN in .env}"
      # Authless by default. Set MCP_OAUTH=1 in .env to enable the auto-approve OAuth
      # layer (only needed if claude.ai's web connector won't connect authless).
      MCP_OAUTH: "${MCP_OAUTH:-0}"
      # Public base for OAuth metadata (only used when MCP_OAUTH=1), from your domain.
      MCP_DOMAIN: "${MCP_DOMAIN:-}"
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:-}"
      MCP_LOG_LEVEL: "${MCP_LOG_LEVEL:-INFO}"
      # Rate-limit avoidance: jittered per-request delay (seconds), low reach concurrency,
      # and a 3-day disk cache of per-ad reach so repeat ads aren't re-fetched.
      MCP_REQUEST_DELAY_MIN: "${MCP_REQUEST_DELAY_MIN:-2.0}"
      MCP_REQUEST_DELAY_MAX: "${MCP_REQUEST_DELAY_MAX:-3.0}"
      MCP_REACH_WORKERS: "${MCP_REACH_WORKERS:-2}"
      MCP_REACH_CACHE: "/data/reach_cache.json"
      MCP_REACH_CACHE_TTL_DAYS: "${MCP_REACH_CACHE_TTL_DAYS:-3}"
    ports:
      - "127.0.0.1:8765:8765"   # localhost only; your reverse proxy fronts it
    volumes:
      - ./data:/data            # persists session_cache.json + .pw-profile + reach_cache.json
